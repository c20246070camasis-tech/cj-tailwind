<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoes Store</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));
    </style>
</head>

<body class="text-center bg-white text-slate-900 dark:bg-slate-900 dark:text-white">

    <div class="w-full min-h-screen border-2 border-slate-700 p-4">

        <h1 class="text-4xl font-bold text-red-500">
            SHOES STORE
        </h1>

        <p class="text-center text-base mb-4">
            List of Shoes
        </p>

        <div class="flex items-center gap-5 mb-3">
            <label class="w-24 text-left text-lg">Adidas</label>
            <input type="text" class="flex-1 min-w-0 rounded border-2 border-slate-400 p-4">
        </div>

        <div class="flex items-center gap-5 mb-3">
            <label class="w-24 text-left text-lg">Nike</label>
            <input type="text" class="flex-1 min-w-0 rounded border-2 border-slate-400 p-4">
        </div>

        <div class="flex items-center gap-5 mb-3">
            <label class="w-24 text-left text-lg">Jordan</label>
            <input type="text" class="flex-1 min-w-0 rounded border-2 border-slate-400 p-4">
        </div>

        <div class="flex items-center gap-5 mb-3">
            <label class="w-24 text-left text-lg">Puma</label>
            <input type="text" class="flex-1 min-w-0 rounded border-2 border-slate-400 p-4">
        </div>

        <div class="flex items-center gap-5 mb-3">
            <label class="w-24 text-left text-lg">Converse</label>
            <input type="text" class="flex-1 min-w-0 rounded border-2 border-slate-400 p-4">
        </div>

        <button id="toggledark"
            class="mt-3 rounded-lg border border-slate-400 px-6 py-3 text-lg hover:bg-red-500 transition-colors">
            Toggle Dark
        </button>

    </div>

    <script>
        const button = document.querySelector('#toggledark');
        const html = document.querySelector('html');

        button.addEventListener('click', function () {
            html.classList.toggle('dark');
        });
    </script>

</body>

</html>
